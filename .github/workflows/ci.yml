name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore JobScheduler.slnx

      - name: Format
        run: dotnet format JobScheduler.slnx --verify-no-changes

      - name: Build
        run: dotnet build JobScheduler.slnx -c Release --no-restore

      - name: Test
        run: dotnet test JobScheduler.slnx -c Release --no-build

      - name: Set up PackageGuard
        run: dotnet tool install --global PackageGuard --version 2.9.1

      - name: Add .NET tools to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $HOME '.dotnet' 'tools')

      - name: PackageGuard
        run: PackageGuard
